[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "knot-strands-agents"
version = "1.0.0"
description = "Governed v1->v2 temporal memory and context toolset for AWS Strands Agents SDK and Bedrock AgentCore"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Knot", email = "team@connectknot.com" },
]
keywords = [
  "strands-agents",
  "aws",
  "amazon-bedrock",
  "agentcore",
  "mcp",
  "context-governance",
  "enterprise-ai",
  "knot",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
strands = ["strands-agents>=1.0.0"]

[project.urls]
Homepage = "https://connectknot.com"
Documentation = "https://connectknot.com/enterprise-brain/reference"
EnterpriseBrain = "https://connectknot.com/enterprise-brain"
Whitepaper = "https://connectknot.com/whitepaper"
Repository = "https://github.com/ConnectKnot/knot-strands-agents"

[tool.setuptools.packages.find]
include = ["knot_strands*"]
